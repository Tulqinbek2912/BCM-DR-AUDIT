# Render.com (bepul tarif) uchun namunaviy Blueprint
services:
  - type: web
    name: bcm-dr-audit-pro
    runtime: docker
    plan: free
    envVars:
      - {key: DEBUG, value: "False"}
      - {key: SECRET_KEY, generateValue: true}
      - {key: ALLOWED_HOSTS, value: ".onrender.com"}
      - {key: CSRF_TRUSTED_ORIGINS, value: "https://*.onrender.com"}
      - {key: SEED_DEMO, value: "1"}
      - {key: DATABASE_URL, fromDatabase: {name: bcm-db, property: connectionString}}
databases:
  - name: bcm-db
    plan: free
